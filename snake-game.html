<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: #101c2d;
      --grid: #12233a;
      --snake: #6ee7b7;
      --snake-head: #34d399;
      --food: #f87171;
      --text: #e5eefb;
      --muted: #9fb5cc;
      --accent: #fbbf24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #13233e, var(--bg) 45%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .app {
      width: min(90vw, 520px);
      padding: 20px;
      border-radius: 22px;
      background: rgba(16, 28, 45, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 28px 60px rgba(0,0,0,0.35);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .title {
      font-size: clamp(1.5rem, 3vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(110, 231, 183, 0.12);
      border: 1px solid rgba(110, 231, 183, 0.18);
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 0.76rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .pill strong {
      color: var(--text);
      font-size: 0.9rem;
    }

    .game-box {
      position: relative;
      background: var(--grid);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, #102033, #0d1b2a);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 17, 31, 0.4);
      backdrop-filter: blur(2px);
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card {
      width: min(82%, 280px);
      background: rgba(12, 21, 35, 0.92);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 18px 16px 14px;
      text-align: center;
      box-shadow: 0 18px 30px rgba(0,0,0,0.25);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.5rem;
    }

    .card p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .start-btn {
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #f59e0b);
      color: #101827;
      font-weight: 700;
      padding: 12px 18px;
      cursor: pointer;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .move-btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .move-btns button {
      border: none;
      background: rgba(110, 231, 183, 0.08);
      color: var(--text);
      border: 1px solid rgba(110, 231, 183, 0.18);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .status {
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">Snake</div>
      <div class="stats">
        <div class="pill">Score <strong id="score">0</strong></div>
        <div class="pill">Best <strong id="best">0</strong></div>
      </div>
    </div>

    <div class="game-box">
      <canvas id="gameCanvas" width="420" height="420" aria-label="Snake game"></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <h2 id="overlayTitle">Ready?</h2>
          <p id="overlayText">Use arrow keys or the buttons below to control the snake.</p>
          <button class="start-btn" id="startBtn">Start Game</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="move-btns">
        <button id="upBtn">↑ Up</button>
        <button id="leftBtn">← Left</button>
        <button id="downBtn">↓ Down</button>
        <button id="rightBtn">→ Right</button>
      </div>
      <div class="status">Arrow keys</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    let snake;
    let direction;
    let nextDirection;
    let food;
    let isRunning = false;
    let animationId = null;
    let tickMs = 160;
    let lastTick = 0;
    let score = 0;
    let bestScore = Number(localStorage.getItem('snakeBest')) || 0;

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      tickMs = 160;
      scoreEl.textContent = '0';
      spawnFood();
    }

    function spawnFood() {
      let x = Math.floor(Math.random() * tileCount);
      let y = Math.floor(Math.random() * tileCount);

      while (snake.some(segment => segment.x === x && segment.y === y)) {
        x = Math.floor(Math.random() * tileCount);
        y = Math.floor(Math.random() * tileCount);
      }

      food = { x, y };
    }

    function startGame() {
      initGame();
      isRunning = true;
      overlay.classList.add('hidden');
      overlayTitle.textContent = 'Ready?';
      overlayText.textContent = 'Use arrow keys or the buttons below to control the snake.';
      startBtn.textContent = 'Restart';
      lastTick = 0;
      animationId = requestAnimationFrame(loop);
    }

    function endGame() {
      isRunning = false;
      cancelAnimationFrame(animationId);
      bestScore = Math.max(bestScore, score);
      localStorage.setItem('snakeBest', String(bestScore));
      bestEl.textContent = String(bestScore);
      overlay.classList.remove('hidden');
      overlayTitle.textContent = 'Game Over';
      overlayText.textContent = `Your score: ${score}. Press restart to play again.`;
      startBtn.textContent = 'Play Again';
    }

    function update() {
      direction = nextDirection;

      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount ||
        snake.some(segment => segment.x === head.x && segment.y === head.y)
      ) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 1;
        scoreEl.textContent = String(score);
        tickMs = Math.max(70, tickMs - 5);
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function drawBoard() {
      ctx.fillStyle = '#12233a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let x = 0; x < tileCount; x++) {
        for (let y = 0; y < tileCount; y++) {
          ctx.strokeStyle = 'rgba(255,255,255,0.04)';
          ctx.strokeRect(x * gridSize, y * gridSize, gridSize, gridSize);
        }
      }

      ctx.fillStyle = '#f87171';
      ctx.fillRect(food.x * gridSize + 4, food.y * gridSize + 4, gridSize - 8, gridSize - 8);

      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? '#34d399' : '#6ee7b7';
        ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 2, gridSize - 4, gridSize - 4);
      });
    }

    function loop(timestamp) {
      if (!isRunning) return;

      if (!lastTick) lastTick = timestamp;
      const delta = timestamp - lastTick;

      if (delta >= tickMs) {
        lastTick = timestamp;
        update();
        if (!isRunning) return;
      }

      drawBoard();
      animationId = requestAnimationFrame(loop);
    }

    function changeDirection(newDir) {
      const isOpposite = newDir.x === -direction.x && newDir.y === -direction.y;
      if (isOpposite) return;
      nextDirection = newDir;
    }

    document.addEventListener('keydown', (event) => {
      if (!isRunning && event.key === ' ') {
        startGame();
      }

      if (event.key === 'ArrowUp' || event.key.toLowerCase() === 'w') changeDirection({ x: 0, y: -1 });
      if (event.key === 'ArrowDown' || event.key.toLowerCase() === 's') changeDirection({ x: 0, y: 1 });
      if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') changeDirection({ x: -1, y: 0 });
      if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') changeDirection({ x: 1, y: 0 });
    });

    document.getElementById('upBtn').addEventListener('click', () => changeDirection({ x: 0, y: -1 }));
    document.getElementById('downBtn').addEventListener('click', () => changeDirection({ x: 0, y: 1 }));
    document.getElementById('leftBtn').addEventListener('click', () => changeDirection({ x: -1, y: 0 }));
    document.getElementById('rightBtn').addEventListener('click', () => changeDirection({ x: 1, y: 0 }));

    startBtn.addEventListener('click', startGame);

    bestEl.textContent = String(bestScore);
    initGame();
    drawBoard();
  </script>
</body>
</html>
