<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Shooter</title>
  <style>
    :root {
      --bg: #040b16;
      --panel: #0d1b2d;
      --panel-2: #11233d;
      --primary: #7dd3fc;
      --accent: #f472b6;
      --gold: #fbbf24;
      --text: #edf6ff;
      --muted: #a8bfd8;
      --danger: #ff6b6b;
      --success: #b8f28a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #172d45, var(--bg) 40%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(92vw, 760px);
      background: rgba(13, 27, 45, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 28px 60px rgba(0,0,0,0.35);
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .title {
      font-size: clamp(1.7rem, 3vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(125, 211, 252, 0.1);
      border: 1px solid rgba(125, 211, 252, 0.16);
      color: var(--muted);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pill strong {
      color: var(--text);
      font-size: 0.95rem;
    }

    .game-box {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(180deg, #0d1c2d, #091724);
      border: 1px solid rgba(255,255,255,0.08);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: radial-gradient(circle at center, #1b2d47 0%, #0b1624 38%, #040b16 100%);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(4, 11, 22, 0.46);
      backdrop-filter: blur(2px);
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card {
      width: min(85%, 330px);
      background: rgba(9, 17, 28, 0.96);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 18px 16px;
      text-align: center;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .card p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.92rem;
    }

    .primary-btn {
      border: none;
      background: linear-gradient(135deg, var(--gold), #f59e0b);
      color: #111827;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-btn {
      border: 1px solid rgba(125, 211, 252, 0.18);
      background: rgba(125, 211, 252, 0.08);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">Space Shooter</div>
      <div class="stats">
        <div class="pill">Score <strong id="score">0</strong></div>
        <div class="pill">Lives <strong id="lives">3</strong></div>
        <div class="pill">Level <strong id="level">1</strong></div>
      </div>
    </div>

    <div class="game-box">
      <canvas id="gameCanvas" width="720" height="440" aria-label="Space shooter game"></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <h2 id="overlayTitle">Ready?</h2>
          <p id="overlayText">Move with A/D or arrow keys. Press space to shoot the enemy swarm.</p>
          <button class="primary-btn" id="startBtn">Start Game</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="buttons">
        <button class="control-btn" id="leftBtn">◀ Left</button>
        <button class="control-btn" id="rightBtn">Right ▶</button>
        <button class="control-btn" id="shootBtn">Fire</button>
      </div>
      <div>A / D / Space</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const levelEl = document.getElementById('level');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');

    const ship = {
      x: canvas.width / 2 - 18,
      y: canvas.height - 42,
      width: 36,
      height: 28,
      speed: 6
    };

    let bullets = [];
    let enemies = [];
    let particles = [];
    let score = 0;
    let lives = 3;
    let level = 1;
    let gameStarted = false;
    let lastTime = 0;
    let spawnCooldown = 0;
    let keys = { left: false, right: false };

    function resetGame() {
      score = 0;
      lives = 3;
      level = 1;
      bullets = [];
      enemies = [];
      particles = [];
      ship.x = canvas.width / 2 - ship.width / 2;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      levelEl.textContent = level;
    }

    function startGame() {
      resetGame();
      gameStarted = true;
      overlay.classList.add('hidden');
      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      gameStarted = false;
      overlayTitle.textContent = 'Game Over';
      overlayText.textContent = `Final score: ${score}. Press start to try again.`;
      overlay.classList.remove('hidden');
    }

    function createEnemy() {
      const size = 20 + Math.random() * 18;
      const enemy = {
        x: Math.random() * (canvas.width - size),
        y: -30,
        size,
        speed: 1.2 + level * 0.4 + Math.random() * 0.7,
        drift: (Math.random() - 0.5) * 1.6
      };
      enemies.push(enemy);
    }

    function shootBullet() {
      bullets.push({
        x: ship.x + ship.width / 2 - 2,
        y: ship.y - 10,
        width: 4,
        height: 14,
        speed: 7
      });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 18; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          size: 2 + Math.random() * 3,
          color,
          life: 30 + Math.random() * 20
        });
      }
    }

    function updateShip() {
      if (keys.left) ship.x -= ship.speed;
      if (keys.right) ship.x += ship.speed;
      ship.x = Math.max(0, Math.min(canvas.width - ship.width, ship.x));
    }

    function updateBullets() {
      bullets.forEach((bullet) => {
        bullet.y -= bullet.speed;
      });
      bullets = bullets.filter((bullet) => bullet.y + bullet.height > 0);
    }

    function updateEnemies() {
      spawnCooldown -= 1;
      if (spawnCooldown <= 0) {
        createEnemy();
        spawnCooldown = Math.max(28, 60 - level * 6);
      }

      enemies.forEach((enemy) => {
        enemy.x += enemy.drift;
        enemy.y += enemy.speed;
        if (enemy.x < 0 || enemy.x + enemy.size > canvas.width) {
          enemy.drift *= -1;
        }
      });

      enemies = enemies.filter((enemy) => enemy.y < canvas.height + 30);
    }

    function updateParticles() {
      particles.forEach((particle) => {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.life -= 1;
      });
      particles = particles.filter((particle) => particle.life > 0);
    }

    function checkCollisions() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          if (
            bullet.x < enemy.x + enemy.size &&
            bullet.x + bullet.width > enemy.x &&
            bullet.y < enemy.y + enemy.size &&
            bullet.y + bullet.height > enemy.y
          ) {
            bullets.splice(i, 1);
            enemies.splice(j, 1);
            score += 10;
            scoreEl.textContent = score;
            createExplosion(enemy.x + enemy.size / 2, enemy.y + enemy.size / 2, '#f472b6');
            if (score > 0 && score % 100 === 0) {
              level += 1;
              levelEl.textContent = level;
            }
            break;
          }
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        if (
          enemy.y + enemy.size >= ship.y &&
          enemy.x + enemy.size >= ship.x &&
          enemy.x <= ship.x + ship.width
        ) {
          enemies.splice(i, 1);
          lives -= 1;
          livesEl.textContent = lives;
          createExplosion(ship.x + ship.width / 2, ship.y + ship.height / 2, '#ff6b6b');
          if (lives <= 0) {
            gameOver();
            return;
          }
        }
      }
    }

    function drawShip() {
      ctx.fillStyle = '#7dd3fc';
      ctx.beginPath();
      ctx.moveTo(ship.x + ship.width / 2, ship.y);
      ctx.lineTo(ship.x + ship.width, ship.y + ship.height);
      ctx.lineTo(ship.x, ship.y + ship.height);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(ship.x + ship.width / 2 - 2, ship.y + 4, 4, 10);
    }

    function drawBullet(bullet) {
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
    }

    function drawEnemy(enemy) {
      ctx.fillStyle = '#f472b6';
      ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(enemy.x + 4, enemy.y + 4, enemy.size - 8, 4);
    }

    function drawParticles() {
      particles.forEach((particle) => {
        ctx.fillStyle = particle.color;
        ctx.globalAlpha = Math.max(0, particle.life / 40);
        ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
      });
      ctx.globalAlpha = 1;
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#081827';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 30; i++) {
        const x = (i * 73 + (score * 2)) % canvas.width;
        const y = (i * 51 + (score / 4)) % canvas.height;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(x, y, 2, 2);
      }
    }

    function tick(timestamp) {
      if (!gameStarted) return;

      if (!lastTime) lastTime = timestamp;
      const delta = timestamp - lastTime;
      lastTime = timestamp;

      updateShip();
      updateBullets();
      updateEnemies();
      updateParticles();
      checkCollisions();

      drawBackground();
      bullets.forEach(drawBullet);
      enemies.forEach(drawEnemy);
      drawParticles();
      drawShip();

      requestAnimationFrame(tick);
    }

    function handleKey(event, isDown) {
      const key = event.key.toLowerCase();
      if (key === 'a' || key === 'arrowleft') keys.left = isDown;
      if (key === 'd' || key === 'arrowright') keys.right = isDown;
      if (key === ' ' && isDown) {
        event.preventDefault();
        shootBullet();
      }
    }

    document.addEventListener('keydown', (event) => handleKey(event, true));
    document.addEventListener('keyup', (event) => handleKey(event, false));

    document.getElementById('leftBtn').addEventListener('click', () => {
      ship.x -= ship.speed * 2;
    });
    document.getElementById('rightBtn').addEventListener('click', () => {
      ship.x += ship.speed * 2;
    });
    document.getElementById('shootBtn').addEventListener('click', () => shootBullet());

    startBtn.addEventListener('click', startGame);

    function gameLoop() {
      if (!gameStarted) return;
      requestAnimationFrame(tick);
    }

    drawBackground();
    drawShip();
    overlayTitle.textContent = 'Ready?';
    overlayText.textContent = 'Move with A/D or arrow keys. Press space to shoot the enemy swarm.';
  </script>
</body>
</html>
