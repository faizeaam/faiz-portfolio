<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --grid: #1f2937;
            --cell: #0b1220;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --x: #60a5fa;
            --o: #fbbf24;
            --accent: #34d399;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #1e293b, var(--bg) 50%);
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
        }

        .app {
            width: min(90vw, 430px);
            padding: 22px;
            border-radius: 22px;
            background: rgba(17, 24, 39, 0.96);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 60px rgba(0,0,0,0.32);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .title {
            font-size: clamp(1.5rem, 4vw, 2.1rem);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .status {
            color: var(--muted);
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            background: var(--grid);
            padding: 10px;
            border-radius: 18px;
        }

        .cell {
            border: none;
            aspect-ratio: 1;
            background: var(--cell);
            border-radius: 14px;
            color: var(--text);
            font-size: clamp(2.4rem, 8vw, 4rem);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .cell:hover {
            transform: translateY(-1px);
            background: #101c2f;
        }

        .cell.x { color: var(--x); }
        .cell.o { color: var(--o); }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .restart {
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #10b981);
            color: #0b1120;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            color: var(--muted);
            font-size: 0.92rem;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="title">Tic Tac Toe</div>
            <div class="status" id="status">Player X turn</div>
        </div>

        <div class="board" id="board" aria-label="Tic Tac Toe board"></div>

        <div class="controls">
            <button class="restart" id="restartBtn">Restart</button>
            <div class="message" id="message">First to line up 3 wins.</div>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const messageEl = document.getElementById('message');
        const restartBtn = document.getElementById('restartBtn');
        const cells = Array(9).fill(null);

        let currentPlayer = 'X';
        let gameOver = false;

        const winningLines = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];

        function createBoard() {
            boardEl.innerHTML = '';
            cells.fill(null);
            currentPlayer = 'X';
            gameOver = false;
            statusEl.textContent = 'Player X turn';
            messageEl.textContent = 'First to line up 3 wins.';

            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('button');
                cell.className = 'cell';
                cell.setAttribute('aria-label', `Cell ${i + 1}`);
                cell.addEventListener('click', () => handleCellClick(i, cell));
                boardEl.appendChild(cell);
            }
        }

        function handleCellClick(index, cell) {
            if (cells[index] || gameOver) return;

            cells[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase());

            if (checkWinner()) {
                gameOver = true;
                statusEl.textContent = `Player ${currentPlayer} wins!`;
                messageEl.textContent = 'Nice move — restart to play again.';
                return;
            }

            if (cells.every(Boolean)) {
                gameOver = true;
                statusEl.textContent = 'Draw game';
                messageEl.textContent = 'No winner this round.';
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusEl.textContent = `Player ${currentPlayer} turn`;
        }

        function checkWinner() {
            for (const [a, b, c] of winningLines) {
                if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
                    highlightCells(a, b, c);
                    return true;
                }
            }
            return false;
        }

        function highlightCells(a, b, c) {
            const allCells = [...document.querySelectorAll('.cell')];
            [a, b, c].forEach(index => {
                allCells[index].style.background = 'rgba(52, 211, 153, 0.12)';
                allCells[index].style.border = '1px solid rgba(52, 211, 153, 0.4)';
            });
        }

        restartBtn.addEventListener('click', createBoard);
        createBoard();
    </script>
</body>
</html>
