<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Notes</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --ink: #17252a;
      --muted: #657276;
      --line: rgba(23,37,42,0.14);
      --accent: #ff735c;
      --lime: #d8f36b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #fdf9f1, #eef4ef);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      display: grid;
      place-items: center;
    }

    .app {
      width: min(92vw, 720px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 18px 36px rgba(23,37,42,0.08);
      padding: 22px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      letter-spacing: -0.04em;
    }

    .form {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    input, textarea, button {
      font: inherit;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .row {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .save-btn {
      border: none;
      background: var(--ink);
      color: white;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 600;
    }

    .notes {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .note {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(135deg, #fff, #f6f4ee);
      padding: 14px;
    }

    .note h3 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .note p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .note button {
      border: none;
      border-radius: 10px;
      background: rgba(255,115,92,0.12);
      color: var(--ink);
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .empty {
      padding: 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Quick Notes</h1>

    <div class="form">
      <input id="title" type="text" placeholder="Note title" maxlength="60" />
      <textarea id="content" placeholder="Write your note here..."></textarea>
      <div class="row">
        <span id="count">0 notes saved</span>
        <button class="save-btn" id="saveBtn">Save Note</button>
      </div>
    </div>

    <div id="notes" class="notes"></div>
  </div>

  <script>
    const titleInput = document.getElementById('title');
    const contentInput = document.getElementById('content');
    const saveBtn = document.getElementById('saveBtn');
    const notesEl = document.getElementById('notes');
    const countEl = document.getElementById('count');

    let notes = JSON.parse(localStorage.getItem('quickNotes') || '[]');

    function renderNotes() {
      notesEl.innerHTML = '';

      if (!notes.length) {
        notesEl.innerHTML = '<div class="empty">No notes yet. Save your first idea.</div>';
      } else {
        notes.forEach((note) => {
          const div = document.createElement('div');
          div.className = 'note';
          div.innerHTML = `
            <h3>${note.title || 'Untitled'}</h3>
            <p>${note.content}</p>
            <button data-id="${note.id}">Delete</button>
          `;
          notesEl.appendChild(div);
        });
      }

      countEl.textContent = `${notes.length} note${notes.length === 1 ? '' : 's'} saved`;
    }

    function saveNote() {
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();

      if (!content) {
        alert('Please write a note before saving.');
        return;
      }

      notes.unshift({
        id: Date.now(),
        title: title || 'Untitled',
        content
      });

      localStorage.setItem('quickNotes', JSON.stringify(notes));
      titleInput.value = '';
      contentInput.value = '';
      renderNotes();
    }

    function deleteNote(id) {
      notes = notes.filter((note) => note.id !== id);
      localStorage.setItem('quickNotes', JSON.stringify(notes));
      renderNotes();
    }

    saveBtn.addEventListener('click', saveNote);

    notesEl.addEventListener('click', (event) => {
      if (event.target.tagName === 'BUTTON') {
        const id = Number(event.target.dataset.id);
        deleteNote(id);
      }
    });

    renderNotes();
  </script>
</body>
</html>
