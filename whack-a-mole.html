<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whack-a-Mole</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --hole: #1e293b;
            --mole: #fbbf24;
            --accent: #34d399;
            --text: #e5e7eb;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #1e293b, var(--bg) 50%);
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
        }

        .app {
            width: min(92vw, 620px);
            background: rgba(17, 24, 39, 0.96);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 28px 60px rgba(0,0,0,0.32);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .title {
            font-size: clamp(1.6rem, 4vw, 2.5rem);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .score-box {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .pill {
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.18);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-top: 18px;
        }

        .hole {
            position: relative;
            aspect-ratio: 1;
            border: none;
            background: linear-gradient(180deg, #1e293b, #0f172a);
            border-radius: 18px;
            cursor: pointer;
            overflow: hidden;
        }

        .hole::before {
            content: "";
            position: absolute;
            inset: 18% 18% 0;
            background: #0b1220;
            border-radius: 50% 50% 16% 16%;
            box-shadow: inset 0 20px 0 rgba(255,255,255,0.05);
            z-index: 0;
        }

        .mole {
            position: absolute;
            left: 50%;
            bottom: -10%;
            transform: translateX(-50%);
            width: 58%;
            height: 58%;
            background: radial-gradient(circle at 50% 32%, #fef3c7, var(--mole) 50%, #d97706 100%);
            border-radius: 50% 50% 45% 45%;
            z-index: 1;
            transition: bottom 0.2s ease;
        }

        .hole.active .mole {
            bottom: 18%;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .start-btn {
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--accent), #10b981);
            color: #04110b;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            color: var(--muted);
            font-size: 0.92rem;
        }

        @media (max-width: 560px) {
            .board {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="title">Whack-a-Mole</div>
            <div class="score-box">
                <div class="pill">Score <strong id="score">0</strong></div>
                <div class="pill">Time <strong id="time">20</strong></div>
            </div>
        </div>

        <div class="board" id="board"></div>

        <div class="controls">
            <button class="start-btn" id="startBtn">Start Game</button>
            <div class="message" id="message">Hit the mole before time runs out.</div>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const messageEl = document.getElementById('message');
        const startBtn = document.getElementById('startBtn');

        let score = 0;
        let timeLeft = 20;
        let activeHole = null;
        let timerId = null;
        let countdownId = null;
        let gameActive = false;

        function buildBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('button');
                hole.className = 'hole';
                hole.type = 'button';
                hole.dataset.index = i;
                hole.innerHTML = '<span class="mole"></span>';
                hole.addEventListener('click', () => hitMole(hole));
                board.appendChild(hole);
            }
        }

        function setMessage(text) {
            messageEl.textContent = text;
        }

        function updateScore() {
            scoreEl.textContent = score;
        }

        function updateTime() {
            timeEl.textContent = timeLeft;
        }

        function randomHole() {
            const holes = [...document.querySelectorAll('.hole')];
            const next = holes[Math.floor(Math.random() * holes.length)];
            if (activeHole === next) return randomHole();
            activeHole = next;
            holes.forEach(hole => hole.classList.remove('active'));
            next.classList.add('active');
        }

        function hitMole(hole) {
            if (!gameActive || !hole.classList.contains('active')) return;
            score += 1;
            updateScore();
            hole.classList.remove('active');
            setMessage('Nice hit!');
            setTimeout(() => {
                if (gameActive) randomHole();
            }, 180);
        }

        function startGame() {
            score = 0;
            timeLeft = 20;
            updateScore();
            updateTime();
            setMessage('Hit the mole before time runs out.');
            gameActive = true;

            if (timerId) clearInterval(timerId);
            if (countdownId) clearInterval(countdownId);

            randomHole();

            timerId = setInterval(() => {
                randomHole();
            }, 650);

            countdownId = setInterval(() => {
                timeLeft -= 1;
                updateTime();
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerId);
            clearInterval(countdownId);
            document.querySelectorAll('.hole').forEach(hole => hole.classList.remove('active'));
            setMessage(`Time up! Final score: ${score}`);
        }

        startBtn.addEventListener('click', startGame);
        buildBoard();
    </script>
</body>
</html>
